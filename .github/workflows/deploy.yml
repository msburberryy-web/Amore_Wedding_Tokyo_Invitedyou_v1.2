name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync Wedding Couples", "Sync Photos from Drive"]
    types: [completed]
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Set asset version
        # Expose a VITE_* env var so the build can embed a stable asset version for cache-busting
        run: echo "VITE_ASSET_VERSION=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build
        run: npm run build
        env:
          VITE_UPLOAD_API_URL: ${{ vars.VITE_UPLOAD_API_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'
    steps:
      - name: Checkout (with history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Post upload codes to Notion for new couples
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: |
          NEW_FILES=$(git diff HEAD~1 HEAD --name-only --diff-filter=A -- 'public/wedding-data_*.json' 2>/dev/null || true)
          if [ -z "$NEW_FILES" ]; then
            echo "No new wedding-data JSON files in this push — skipping Notion notify."
            exit 0
          fi
          echo "$NEW_FILES" | while read -r f; do
            folder=$(echo "$f" | sed 's|public/wedding-data_||;s|\.json||')
            echo "Notifying Notion for: $folder"
            node .github/scripts/post-upload-code.js "$folder"
          done